name: Eizo v1.2.1 manual single-file video cache acceptance

on:
  push:
    branches:
      - "fix/manual-video-single-file"
      - "release/v1.2.1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eizo-v121-manual-video-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Build, sign, package and validate Eizo 1.2.1 / 1.2.1.0
    runs-on: windows-2025-vs2026
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate release/version contract
        shell: pwsh
        run: ./scripts/Test-ReleaseVersionContract.ps1

      - name: Build and validate signed acceptance assets
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
          EIZO_METADATA_DISABLE: "1"
        run: ./scripts/Build-EizoV121Acceptance.ps1

      - name: Upload acceptance assets
        uses: actions/upload-artifact@v7
        with:
          name: Eizo-v1.2.1-manual-video-single-file-acceptance-assets
          path: |
            ${{ runner.temp }}/Eizo-v1.2.1-acceptance/Eizo_1.2.1.0_x64.msixbundle
            ${{ runner.temp }}/Eizo-v1.2.1-acceptance/Eizo-v1.2.1-AppPublisher.cer
            ${{ runner.temp }}/Eizo-v1.2.1-acceptance/Eizo-v1.2.1-x64-one-click.zip
            ${{ runner.temp }}/Eizo-v1.2.1-acceptance/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
