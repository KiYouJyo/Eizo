name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - "release/release.json"
      - ".github/workflows/publish-github-release.yml"
      - "docs/RELEASE-NOTES-v0.1.0*"
      - "packaging/**"
      - "src/Eizo.App/Eizo.App.csproj"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eizo-github-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release metadata
        id: version
        shell: pwsh
        run: |
          $release = Get-Content -LiteralPath release/release.json -Raw | ConvertFrom-Json
          if ([int]$release.schemaVersion -ne 1) { throw 'Unsupported release metadata schema.' }
          if (-not $release.channels.github.publish) { throw 'GitHub publication is disabled.' }

          $version = [string]$release.product.version
          $packageVersion = [string]$release.product.packageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or
              $packageVersion -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              -not $packageVersion.StartsWith("$version.")) {
            throw 'Invalid release version metadata.'
          }

          [xml]$project = Get-Content -Raw src/Eizo.App/Eizo.App.csproj
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $informationalVersion = @($project.Project.PropertyGroup | ForEach-Object InformationalVersion | Where-Object { $_ })[0]
          [xml]$manifest = Get-Content -Raw src/Eizo.App/Package.appxmanifest

          if ($projectVersion -ne $version -or
              $informationalVersion -ne $version -or
              $manifest.Package.Identity.Version -ne $packageVersion) {
            throw "Source version mismatch. Project=$projectVersion Informational=$informationalVersion Manifest=$($manifest.Package.Identity.Version) Expected=$version/$packageVersion"
          }

          foreach ($path in @(
              "docs/RELEASE-NOTES-v$version.md",
              "docs/RELEASE-NOTES-v$version.ja.md",
              "docs/RELEASE-NOTES-v$version.en.md")) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release notes: $path"
            }
          }

          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_version=$packageVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate signing configuration
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'GitHub release signing secrets are not configured.'
          }

      - name: Restore and compile Release
        shell: pwsh
        run: |
          msbuild src\Eizo.App\Eizo.App.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "Release compile failed: $LASTEXITCODE" }

      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'Eizo-AppPackages'
          msbuild src\Eizo.App\Eizo.App.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }

          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle' -File) | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }

          $assets = Join-Path $env:RUNNER_TEMP 'Eizo-ReleaseAssets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $bundleName = "Eizo_${{ steps.version.outputs.package_version }}_x64.msixbundle"
          $bundlePath = Join-Path $assets $bundleName
          Copy-Item -LiteralPath $bundle.FullName -Destination $bundlePath -Force

          "ASSETS_DIR=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_PATH=$bundlePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLE_FILE_NAME=$bundleName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign bundle and export public certificate
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'eizo-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password

          if ($certificate.Subject -cne 'CN=AppPublisher' -or
              $certificate.Thumbprint -cne 'BD85AD77A651C86CA01A480C8E9BC64952993F98' -or
              -not $certificate.HasPrivateKey) {
            throw "Unexpected signing certificate: $($certificate.Subject) / $($certificate.Thumbprint)"
          }

          $cer = Join-Path $env:RUNNER_TEMP "Eizo-v${{ steps.version.outputs.version }}-Framework-Dependent.cer"
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null

          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\signtool.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }

          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }

          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -cne 'CN=AppPublisher' -or
              $signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) {
            throw 'Signed bundle signer mismatch.'
          }
          if ($signature.Status -eq 'UnknownError') {
            if ($signature.StatusMessage -notmatch '(?i)not trusted|trust provider|untrusted|self-signed') {
              throw "Unexpected Authenticode status: $($signature.StatusMessage)"
            }
          }
          elseif ($signature.Status -ne 'Valid') {
            throw "Signed bundle Authenticode status is not acceptable: $($signature.Status) / $($signature.StatusMessage)"
          }

          Remove-Item -LiteralPath $pfx -Force
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Signer verified: $($signature.SignerCertificate.Subject) / $($signature.SignerCertificate.Thumbprint); status=$($signature.Status)"

      - name: Install and launch signed bundle
        shell: pwsh
        run: |
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:CERTIFICATE_PATH)
          $trustedStore = 'Cert:\LocalMachine\TrustedPeople'
          $trusted = Get-ChildItem $trustedStore -ErrorAction SilentlyContinue |
            Where-Object Thumbprint -eq $cert.Thumbprint |
            Select-Object -First 1
          if (-not $trusted) {
            Import-Certificate -FilePath $env:CERTIFICATE_PATH -CertStoreLocation $trustedStore | Out-Null
          }

          $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.8/1.8.260710003/windowsappruntimeinstall-x64.exe' -OutFile $runtimeInstaller -UseBasicParsing
          $runtimeSignature = Get-AuthenticodeSignature -FilePath $runtimeInstaller
          if (-not $runtimeSignature.SignerCertificate -or
              $runtimeSignature.Status -ne 'Valid' -or
              $runtimeSignature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'Windows App Runtime CI prerequisite failed signature verification.'
          }
          & $runtimeInstaller --quiet
          if ($LASTEXITCODE -ne 0) { throw "Windows App Runtime CI setup failed: $LASTEXITCODE" }

          Get-AppxPackage -Name Eizo -ErrorAction SilentlyContinue | Remove-AppxPackage -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $env:BUNDLE_PATH -ForceApplicationShutdown

          $pkg = Get-AppxPackage -Name Eizo
          if (-not $pkg -or [string]$pkg.Version -ne '${{ steps.version.outputs.package_version }}') {
            throw 'Signed Eizo package was not registered correctly.'
          }

          $manifest = Get-AppxPackageManifest -Package $pkg
          $appId = [string]$manifest.Package.Applications.Application.Id
          $activation = "shell:AppsFolder\$($pkg.PackageFamilyName)!$appId"
          Start-Process explorer.exe -ArgumentList $activation
          Start-Sleep -Seconds 8

          $installRoot = [IO.Path]::GetFullPath($pkg.InstallLocation)
          $running = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
            try {
              $_.Path -and
              ([IO.Path]::GetFullPath($_.Path)).StartsWith($installRoot,[StringComparison]::OrdinalIgnoreCase)
            }
            catch { $false }
          })
          if ($running.Count -eq 0) {
            throw 'Eizo failed the release launch smoke test.'
          }

          Write-Host "Eizo release launch smoke PASS: $($running.ProcessName -join ', ')"
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-AppxPackage -Name Eizo | Remove-AppxPackage -ErrorAction SilentlyContinue

      - name: Generate and validate one-click package
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'Eizo-one-click-staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $buildArgs = @{
            SignedBundlePath = $env:BUNDLE_PATH
            PublicCertificatePath = $env:CERTIFICATE_PATH
            OutputDirectory = $staging
            DisplayVersion = '${{ steps.version.outputs.version }}'
            PackageVersion = '${{ steps.version.outputs.package_version }}'
          }
          & ./packaging/New-GitHubOneClickInstallerPackage.ps1 @buildArgs

          $packageRoot = Join-Path $staging "Eizo-v${{ steps.version.outputs.version }}-x64-one-click"
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $packageRoot

          $zip = Join-Path $env:ASSETS_DIR "Eizo-v${{ steps.version.outputs.version }}-x64-one-click.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zip -CompressionLevel Optimal

          $extracted = Join-Path $env:RUNNER_TEMP 'Eizo-one-click-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          $extractedRoot = Join-Path $extracted "Eizo-v${{ steps.version.outputs.version }}-x64-one-click"
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $extractedRoot -ZipPath $zip

          $installPayload = Join-Path $extractedRoot 'payload\Install.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $installPayload -BundlePathOverride $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "One-click local bundle validation failed: $LASTEXITCODE" }

          $installed = Get-AppxPackage -Name Eizo
          if (-not $installed -or [string]$installed.Version -ne '${{ steps.version.outputs.package_version }}') {
            throw 'One-click bootstrap did not install the expected Eizo package.'
          }

          $uninstallPayload = Join-Path $extractedRoot 'payload\Uninstall.ps1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $uninstallPayload -RemoveCertificate
          if ($LASTEXITCODE -ne 0) { throw "One-click uninstall validation failed: $LASTEXITCODE" }

      - name: Prepare SHA256 manifest
        shell: pwsh
        run: |
          $releaseFiles = @(
            $env:BUNDLE_PATH,
            (Join-Path $env:ASSETS_DIR "Eizo-v${{ steps.version.outputs.version }}-x64-one-click.zip")
          )

          $manifest = foreach ($file in $releaseFiles) {
            $item = Get-Item -LiteralPath $file
            "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), $item.Name
          }

          Set-Content -LiteralPath (Join-Path $env:ASSETS_DIR 'SHA256SUMS.txt') -Value $manifest -Encoding ascii
          Get-Content (Join-Path $env:ASSETS_DIR 'SHA256SUMS.txt')

      - name: Generate GitHub Release body
        shell: pwsh
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.published.md'
          & ./packaging/New-GitHubReleaseBody.ps1 -Version '${{ steps.version.outputs.version }}' -OutputPath $notes
          "RELEASE_NOTES_PATH=$notes" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create or verify release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch --tags --force

          $tagCommit = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit) {
            if ($tagCommit.Trim() -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag points to $tagCommit instead of $env:GITHUB_SHA"
            }
            Write-Host "Tag $tag already points to release commit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag $env:GITHUB_SHA -m "Eizo $tag"
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag" }
          }

      - name: Create or reconcile GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $title = "Eizo $tag"

          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>&1
          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
          }
          elseif (($releaseJson -join ' ') -match '(?i)404|not found') {
            & gh release create $tag --verify-tag --title $title --notes-file $env:RELEASE_NOTES_PATH
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed: $LASTEXITCODE" }
            $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          }
          else {
            throw "Release lookup failed: $($releaseJson -join ' ')"
          }

          $expected = @(
            "Eizo_${{ steps.version.outputs.package_version }}_x64.msixbundle",
            "Eizo-v${{ steps.version.outputs.version }}-x64-one-click.zip",
            'SHA256SUMS.txt'
          )
          $remote = gh api "repos/${{ github.repository }}/releases/$($release.id)/assets" | ConvertFrom-Json

          foreach ($name in $expected) {
            $local = Get-Item -LiteralPath (Join-Path $env:ASSETS_DIR $name)
            $existing = @($remote | Where-Object name -eq $name)
            if ($existing.Count -gt 1) { throw "Duplicate Release asset: $name" }

            if ($existing.Count -eq 1) {
              $localHash = (Get-FileHash $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existing[0].digest -and $existing[0].digest -ne "sha256:$localHash") {
                throw "Existing Release asset hash conflict: $name"
              }
              continue
            }

            & gh release upload $tag $local.FullName
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed: $name" }
          }

      - name: Verify published Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($release.tag_name -ne $tag -or $release.draft -or $release.prerelease) {
            throw 'Published Release metadata mismatch.'
          }

          $normalize = {
            param($value)
            (($value -replace [char]13 + [char]10, [char]10) -replace [char]13, [char]10).TrimEnd()
          }
          $expectedBody = Get-Content -LiteralPath $env:RELEASE_NOTES_PATH -Raw
          if ((& $normalize $release.body) -ne (& $normalize $expectedBody)) {
            throw 'Published Release body does not match generated release notes.'
          }

          $expected = @(
            "Eizo_${{ steps.version.outputs.package_version }}_x64.msixbundle",
            "Eizo-v${{ steps.version.outputs.version }}-x64-one-click.zip",
            'SHA256SUMS.txt'
          )
          $remote = gh api "repos/${{ github.repository }}/releases/$($release.id)/assets" | ConvertFrom-Json
          if (@($remote).Count -ne 3) {
            throw "Published Release must contain exactly three assets; found $(@($remote).Count)."
          }

          foreach ($name in $expected) {
            $asset = @($remote | Where-Object name -eq $name)
            if ($asset.Count -ne 1) { throw "Published Release is missing $name" }

            $localHash = (Get-FileHash (Join-Path $env:ASSETS_DIR $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -and $asset[0].digest -ne "sha256:$localHash") {
              throw "Published asset digest mismatch: $name"
            }
          }

          Write-Host "Published Eizo $tag with the expected three-asset contract."

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: Eizo-${{ steps.version.outputs.version }}-github-release-assets
          path: |
            ${{ env.ASSETS_DIR }}/Eizo_${{ steps.version.outputs.package_version }}_x64.msixbundle
            ${{ env.ASSETS_DIR }}/Eizo-v${{ steps.version.outputs.version }}-x64-one-click.zip
            ${{ env.ASSETS_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
