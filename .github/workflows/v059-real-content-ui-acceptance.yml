name: Eizo v0.5.9 real-content UI Slice A acceptance

on:
  push:
    branches:
      - "feat/v0.5.9-real-content-ui"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eizo-v059-real-content-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Build, sign, install and validate x64 real-content-ui build
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate release/version contract
        shell: pwsh
        run: ./scripts/Test-ReleaseVersionContract.ps1

      - name: Build and validate acceptance assets
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
          EIZO_METADATA_DISABLE: "1"
        run: ./scripts/Build-EizoV059Acceptance.ps1

      - name: Upload acceptance assets
        uses: actions/upload-artifact@v7
        with:
          name: Eizo-v0.5.9-real-content-ui-acceptance-assets
          path: |
            ${{ runner.temp }}/Eizo-v0.5.9-acceptance/Eizo_0.5.9.0_x64.msixbundle
            ${{ runner.temp }}/Eizo-v0.5.9-acceptance/Eizo-v0.5.9-AppPublisher.cer
            ${{ runner.temp }}/Eizo-v0.5.9-acceptance/Eizo-v0.5.9-x64-one-click.zip
            ${{ runner.temp }}/Eizo-v0.5.9-acceptance/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
