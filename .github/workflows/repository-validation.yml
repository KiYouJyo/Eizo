name: Repository validation

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  localization:
    name: Validate localization resources
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RESW key parity
        shell: pwsh
        run: ./scripts/Test-Localization.ps1

      - name: Validate navigation pane theme contract
        shell: pwsh
        run: ./scripts/Test-NavigationPaneThemeContract.ps1

  winui-build:
    name: Build WinUI 3 app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore pinned Eizo.Playback packages
        shell: pwsh
        run: ./scripts/Restore-EizoPlayback.ps1

      - name: Restore and build
        shell: pwsh
        run: >
          msbuild src\Eizo.App\Eizo.App.csproj
          /restore
          /m
          /p:Configuration=Debug
          /p:Platform=x64
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false
