name: PR51 loading regression hotfix

on:
  push:
    branches:
      - "fix/playback-hang-and-controls"

permissions:
  contents: write

jobs:
  hotfix-and-package:
    if: ${{ !contains(github.event.head_commit.message, '[pr51-loading-fixed]') }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply loading-status dispatcher hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/Eizo.App/Views/PlayerView.xaml.cs'
          $text = (Get-Content -LiteralPath $path -Raw).Replace("`r`n", "`n")

          $old = @'
              private void Dispatch(Action action)
              {
                  var session = _session;
                  DispatcherQueue.TryEnqueue(() =>
                  {
                      if (!_isPreparingForDetach && ReferenceEquals(session, _session) && !session.Token.IsCancellationRequested) action();
                  });
              }
          '@.Replace("`r", '').Trim()

          $new = @'
              private void Dispatch(Action action)
              {
                  var session = _session;

                  void Invoke()
                  {
                      if (_isPreparingForDetach ||
                          !ReferenceEquals(session, _session) ||
                          session.Token.IsCancellationRequested)
                      {
                          return;
                      }

                      action();
                  }

                  if (DispatcherQueue.HasThreadAccess)
                  {
                      Invoke();
                      return;
                  }

                  DispatcherQueue.TryEnqueue(Invoke);
              }
          '@.Replace("`r", '').Trim()

          if (-not $text.Contains($old)) {
            throw 'Expected PlayerView.Dispatch implementation was not found; refusing an unsafe patch.'
          }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text.Replace("`n", "`r`n"), [Text.UTF8Encoding]::new($false))

          if (-not (Select-String -LiteralPath $path -SimpleMatch 'if (DispatcherQueue.HasThreadAccess)' -Quiet)) {
            throw 'Dispatcher inline-path verification failed.'
          }

      - name: Complete playback operation queue patch
        shell: pwsh
        run: ./scripts/Append-PR51OperationQueuePatch.ps1

      - name: Restore pinned Eizo.Playback packages
        shell: pwsh
        run: ./scripts/Restore-EizoPlayback.ps1

      - name: Run concurrency tests
        shell: pwsh
        run: dotnet test tests/Eizo.Concurrency.Tests/Eizo.Concurrency.Tests.csproj --configuration Release

      - name: Build Release x64
        shell: pwsh
        run: >
          msbuild src\Eizo.App\Eizo.App.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=false

      - name: Build unsigned acceptance MSIX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'Eizo-AppPackages'
          msbuild src\Eizo.App\Eizo.App.csproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }

          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle' -File) | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }

          $assets = Join-Path $env:RUNNER_TEMP 'Eizo-PR51-loading-fix-acceptance'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $finalBundle = Join-Path $assets 'Eizo_PR51_loading_fix_x64.msixbundle'
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSETS_DIR=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign acceptance bundle
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) {
            throw 'GitHub release signing secrets are not configured.'
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'eizo-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'Signing certificate import failed.' }

          $cer = Join-Path $env:ASSETS_DIR 'Eizo-PR51-AppPublisher.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null

          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\signtool.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }

          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }

          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate) { throw 'Signed bundle has no signer certificate.' }
          Remove-Item -LiteralPath $pfx -Force

          @'
          Eizo PR #51 loading-window regression acceptance build

          Fixed:
          - PlayerView.Dispatch executes inline when already on the UI thread, while retaining session guards for queued callbacks.
          - Fresh Eizo.Playback --no-checkout clones are no longer mistaken for dirty dependency worktrees.
          - The missing PlaybackOperationQueue implementation is included in the pinned Eizo.Playback patch.

          Acceptance focus:
          1. Open a WebDAV video and verify the loading card appears immediately.
          2. Verify loading ring/metrics remain visible until Playing/Paused.
          3. Switch subtitle tracks repeatedly.
          4. Enter/exit fullscreen repeatedly.
          5. Verify no hang regression.
          '@ | Set-Content -LiteralPath (Join-Path $env:ASSETS_DIR 'ACCEPTANCE.txt') -Encoding utf8

      - name: Upload acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eizo-PR51-loading-fix-acceptance
          path: ${{ env.ASSETS_DIR }}
          if-no-files-found: error

      - name: Commit source fixes and remove temporary helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/pr51-loading-regression-hotfix.yml
          git rm --ignore-unmatch scripts/Append-PR51OperationQueuePatch.ps1
          git add src/Eizo.App/Views/PlayerView.xaml.cs eng/playback-patches/0001-playback-concurrency.patch
          git commit -m 'fix: restore loading dispatch and complete playback queue [pr51-loading-fixed]'
          git push origin HEAD:fix/playback-hang-and-controls
