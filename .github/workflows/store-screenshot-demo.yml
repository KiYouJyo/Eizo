name: Eizo Store screenshot demo

on:
  push:
    branches:
      - "demo/store-screenshots-v1.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eizo-store-screenshot-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build signed Eizo Demo package
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: ./scripts/Build-EizoStoreScreenshotDemo.ps1

      - name: Upload Eizo Demo
        uses: actions/upload-artifact@v7
        with:
          name: Eizo-Demo-v1.0.0
          path: |
            ${{ runner.temp }}/Eizo-Demo-v1.0.0/*
          if-no-files-found: error
          retention-days: 14
