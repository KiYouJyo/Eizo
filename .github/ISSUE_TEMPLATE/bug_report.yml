name: Bug report
description: Report a reproducible problem in Eizo.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Japanese media recognition
        - Metadata / scraping
        - Playback
        - Subtitles / audio tracks
        - Local library
        - WebDAV
        - Cloud storage
        - Streaming / cache
        - UI / localization
        - Packaging / update
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Eizo version / commit
      placeholder: e.g. 0.1.0 or commit SHA
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media details
      description: If relevant, include filename pattern, codec/container, subtitle format, and source type. Remove private paths and credentials.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include tokens, passwords, private media URLs, signing material, or store credentials.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: I confirm this report contains no credentials, tokens, private keys, or other secrets.
          required: true
